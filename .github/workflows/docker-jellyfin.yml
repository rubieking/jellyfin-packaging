name: Build and Push jellyfin Docker image to GHCR

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      working-directory: .
      run: |
        IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/jellyfin-${{ github.ref_name }} IMAGE_TAG=${{ github.sha }} make push
